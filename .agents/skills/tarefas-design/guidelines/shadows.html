<!-- @dsCard group="Spacing" viewport="700x140" name="Shadows" subtitle="Subtle card shadow → deeper modal shadows" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:24px;align-items:center;height:130px;font-family:var(--font-sans);background:var(--bg-page);padding:0 4px">
  <div style="width:120px;height:80px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:var(--font-meta);color:var(--ink-600)">card</div>
  <div style="width:120px;height:80px;background:#fff;border-radius:18px;box-shadow:var(--shadow-modal);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:var(--font-meta);color:var(--ink-600)">modal</div>
  <div style="width:120px;height:80px;background:#fff;border-radius:20px;box-shadow:var(--shadow-modal-lg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:var(--font-meta);color:var(--ink-600)">modal-lg</div>
  <div style="width:52px;height:52px;background:var(--ink-900);border-radius:50%;box-shadow:var(--shadow-fab);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px">+</div>
</div>
