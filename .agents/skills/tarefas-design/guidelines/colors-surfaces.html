<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Borders" subtitle="Page bg, card surface, sunken surface, border ramp" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;font-family:var(--font-sans);height:150px">
  <div style="flex:1;background:var(--bg-page);display:flex;align-items:flex-end;padding:8px;color:var(--ink-900);font:var(--font-meta);border-right:1px solid var(--border-default)">bg-page</div>
  <div style="flex:1;background:var(--surface);display:flex;align-items:flex-end;padding:8px;color:var(--ink-900);font:var(--font-meta);border-right:1px solid var(--border-default)">surface</div>
  <div style="flex:1;background:var(--surface-sunken);display:flex;align-items:flex-end;padding:8px;color:var(--ink-900);font:var(--font-meta);border-right:1px solid var(--border-default)">surface-sunken</div>
  <div style="flex:1;background:var(--surface-neutral-button);display:flex;align-items:flex-end;padding:8px;color:var(--ink-900);font:var(--font-meta);border-right:1px solid var(--border-default)">neutral-button</div>
  <div style="flex:1;background:var(--surface);display:flex;align-items:flex-end;padding:8px;color:var(--ink-900);font:var(--font-meta);border:4px solid var(--border-default)">border-default</div>
</div>
