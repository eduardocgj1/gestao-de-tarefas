<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="2px–26px, used for padding/gaps across the app" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;align-items:flex-end;gap:10px;height:140px;font-family:var(--font-sans)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-1);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">2</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-2);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-4);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-6);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">12</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-8);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">16</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-10);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">20</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:var(--space-12);background:var(--green-600)"></div><span style="font:var(--font-meta);color:var(--text-meta)">26</span></div>
</div>
