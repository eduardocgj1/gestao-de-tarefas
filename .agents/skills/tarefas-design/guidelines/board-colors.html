<!-- @dsCard group="Brand" viewport="700x160" name="Board Identity Colors" subtitle="Each board gets a dot color; Trabalho=green, Pessoal=terracotta" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;flex-direction:column;gap:10px;height:150px;justify-content:center;font-family:var(--font-sans)">
  <div style="display:flex;align-items:center;gap:10px;background:var(--green-100);color:var(--green-600);padding:9px 12px;border-radius:10px;font:600 13px var(--font-sans);width:180px">
    <span style="width:9px;height:9px;border-radius:50%;background:var(--green-600)"></span>Trabalho
  </div>
  <div style="display:flex;align-items:center;gap:10px;color:var(--ink-900);padding:9px 12px;border-radius:10px;font:600 13px var(--font-sans);width:180px">
    <span style="width:9px;height:9px;border-radius:50%;background:var(--terracotta-600)"></span>Pessoal
  </div>
  <div style="display:flex;align-items:center;gap:10px;color:var(--ink-900);padding:9px 12px;border-radius:10px;font:600 13px var(--font-sans);width:180px">
    <span style="width:9px;height:9px;border-radius:50%;background:var(--blue-600)"></span>Multi-board (evento)
  </div>
</div>
