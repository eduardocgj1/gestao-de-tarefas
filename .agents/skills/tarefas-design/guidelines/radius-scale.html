<!-- @dsCard group="Spacing" viewport="700x150" name="Radius Scale" subtitle="Buttons 9–11px, cards/panels 16px, pills 20px" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;align-items:center;height:140px;font-family:var(--font-sans)">
  <div style="width:64px;height:64px;background:var(--sand-200);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font:var(--font-meta);color:var(--ink-600)">9px</div>
  <div style="width:64px;height:64px;background:var(--sand-200);border-radius:var(--radius-xl);display:flex;align-items:center;justify-content:center;font:var(--font-meta);color:var(--ink-600)">10px</div>
  <div style="width:64px;height:64px;background:var(--sand-200);border-radius:var(--radius-panel);display:flex;align-items:center;justify-content:center;font:var(--font-meta);color:var(--ink-600)">16px</div>
  <div style="width:64px;height:64px;background:var(--sand-200);border-radius:var(--radius-modal);display:flex;align-items:center;justify-content:center;font:var(--font-meta);color:var(--ink-600)">18px</div>
  <div style="width:120px;height:36px;background:var(--green-100);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;font:var(--font-meta);color:var(--green-600)">pill 20px</div>
  <div style="width:52px;height:52px;background:var(--ink-900);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px">+</div>
</div>
