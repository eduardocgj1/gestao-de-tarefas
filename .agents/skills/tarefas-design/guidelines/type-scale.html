<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-sans);display:flex;flex-direction:column;gap:6px;padding:4px 0">
  <div style="font:800 19px var(--font-sans);color:var(--ink-900)">Modal title — 800 / 19px</div>
  <div style="font:700 17px var(--font-sans);color:var(--ink-900)">Page title — 700 / 17px</div>
  <div style="font:700 13.5px var(--font-sans);color:var(--ink-900)">Column title — 700 / 13.5px</div>
  <div style="font:600 13px var(--font-sans);color:var(--ink-900)">Body / task name — 600 / 13px</div>
  <div style="font:700 11px var(--font-sans);color:var(--ink-200);text-transform:uppercase;letter-spacing:.05em">Section label — 700 / 11px uppercase</div>
  <div style="font:600 10.5px var(--font-sans);color:var(--ink-300)">Meta / caption — 600 / 10.5px</div>
</div>
