<!-- @dsCard group="Colors" viewport="700x150" name="Task State Colors" subtitle="Normal / urgent / completed task-card treatment" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;font-family:var(--font-sans);padding:6px 0;height:138px;align-items:stretch">
  <div style="flex:1;border-radius:11px;padding:9px 11px;border-left:3px solid var(--task-normal-border);background:var(--task-normal-bg)">
    <div style="font:var(--font-body);color:var(--ink-900)">Tarefa normal</div>
    <div style="font:var(--font-meta);color:var(--text-meta);margin-top:6px">quase P&B</div>
  </div>
  <div style="flex:1;border-radius:11px;padding:9px 11px;border-left:3px solid var(--task-urgent-border);background:var(--task-urgent-bg)">
    <div style="font:var(--font-body);color:var(--ink-900)">Tarefa urgente</div>
    <div style="font:700 9px var(--font-sans);color:var(--terracotta-600);margin-top:6px">URGENTE</div>
  </div>
  <div style="flex:1;border-radius:11px;padding:9px 11px;border-left:3px solid var(--task-done-border);background:var(--task-done-bg);opacity:.55">
    <div style="font:var(--font-body);color:var(--ink-900);text-decoration:line-through">Tarefa concluída</div>
    <div style="font:var(--font-meta);color:var(--text-meta);margin-top:6px">opacidade .55</div>
  </div>
</div>
